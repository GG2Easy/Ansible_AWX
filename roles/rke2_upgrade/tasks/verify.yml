---
- name: Wait for all RKE2 nodes to return Ready on the requested version
  kubernetes.core.k8s_info:
    host: "{{ rancher_downstream_api_url }}"
    validate_certs: "{{ rancher_validate_certs }}"
    api_version: v1
    kind: Node
  register: rke2_nodes_after
  changed_when: false
  vars:
    rke2_nodes_at_target: >-
      {{ rke2_nodes_after.resources
         | selectattr('status.nodeInfo.kubeletVersion', 'equalto', rke2_target_version)
         | list }}
  until:
    - rke2_nodes_after.resources | length == rke2_expected_node_count | int
    - rke2_nodes_at_target | length == rke2_expected_node_count | int
    - >-
      rke2_nodes_after.resources[0].status.conditions
      | selectattr('type', 'equalto', 'Ready')
      | selectattr('status', 'equalto', 'True')
      | list | length == 1
  retries: 60
  delay: 10

- name: Wait for Rancher to report the downstream cluster healthy
  ansible.builtin.uri:
    url: "{{ rancher_api_url }}/v3/clusters/{{ rancher_cluster_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY') }}"
      Accept: application/json
    validate_certs: "{{ rancher_validate_certs }}"
    return_content: true
    status_code: 200
  register: rancher_cluster_after
  changed_when: false
  no_log: true
  until:
    - rancher_cluster_after.json.state == 'active'
    - rancher_cluster_after.json.transitioning == 'no'
    - rancher_cluster_after.json.version.gitVersion == rke2_target_version
  retries: 60
  delay: 10

- name: Confirm the final Plan, node, and Rancher states
  ansible.builtin.assert:
    that:
      - rke2_upgrade_plan.resources[0].status.latestVersion == rke2_target_version
      - rke2_nodes_after.resources | length == rke2_expected_node_count | int
      - >-
        rke2_nodes_after.resources
        | selectattr('status.nodeInfo.kubeletVersion', 'equalto', rke2_target_version)
        | list | length == rke2_expected_node_count | int
      - rancher_cluster_after.json.id == rancher_cluster_id
      - rancher_cluster_after.json.state == 'active'
      - rancher_cluster_after.json.transitioning == 'no'
      - rancher_cluster_after.json.version.gitVersion == rke2_target_version
    fail_msg: "RKE2 or Rancher did not converge to the requested healthy state."

- name: Report the completed upgrade
  ansible.builtin.debug:
    msg:
      rancher_cluster: "{{ rancher_cluster_id }}"
      previous_version: "{{ rke2_current_version }}"
      requested_version: "{{ rke2_target_version }}"
      node_versions: "{{ rke2_nodes_after.resources | map(attribute='status.nodeInfo.kubeletVersion') | list }}"
      snapshot_files: "{{ rke2_verified_snapshot_files | map(attribute='metadata.name') | list }}"
      plan: "{{ rke2_upgrade_namespace }}/{{ rke2_upgrade_plan_name }}"

---
- name: Ensure the upgrade job ServiceAccount exists
  kubernetes.core.k8s:
    host: "{{ rancher_downstream_api_url }}"
    validate_certs: "{{ rancher_validate_certs }}"
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ rke2_upgrade_service_account_name }}"
        namespace: "{{ rke2_upgrade_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible
          app.kubernetes.io/part-of: rke2-upgrade

- name: Submit the RKE2 server upgrade Plan
  kubernetes.core.k8s:
    host: "{{ rancher_downstream_api_url }}"
    validate_certs: "{{ rancher_validate_certs }}"
    state: present
    definition:
      apiVersion: upgrade.cattle.io/v1
      kind: Plan
      metadata:
        name: "{{ rke2_upgrade_plan_name }}"
        namespace: "{{ rke2_upgrade_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible
          app.kubernetes.io/part-of: rke2-upgrade
        annotations:
          awx.ansible.com/requested-version: "{{ rke2_target_version }}"
          awx.ansible.com/snapshot-operation: "{{ rke2_snapshot_operation_name }}"
      spec:
        concurrency: "{{ rke2_upgrade_concurrency | int }}"
        cordon: true
        nodeSelector:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
        serviceAccountName: "{{ rke2_upgrade_service_account_name }}"
        tolerations:
          - operator: Exists
        upgrade:
          image: rancher/rke2-upgrade
        version: "{{ rke2_target_version }}"
  register: rke2_upgrade_plan_submit

- name: Wait for the System Upgrade Controller Plan to complete
  kubernetes.core.k8s_info:
    host: "{{ rancher_downstream_api_url }}"
    validate_certs: "{{ rancher_validate_certs }}"
    api_version: upgrade.cattle.io/v1
    kind: Plan
    namespace: "{{ rke2_upgrade_namespace }}"
    name: "{{ rke2_upgrade_plan_name }}"
  register: rke2_upgrade_plan
  changed_when: false
  until:
    - rke2_upgrade_plan.resources | length == 1
    - rke2_upgrade_plan.resources[0].status.latestVersion | default('') == rke2_target_version
    - >-
      rke2_upgrade_plan.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Complete')
      | selectattr('status', 'equalto', 'True')
      | list | length == 1
  retries: "{{ (rke2_upgrade_timeout_seconds / rke2_upgrade_poll_seconds) | int }}"
  delay: "{{ rke2_upgrade_poll_seconds | int }}"

---
- name: Trigger Rancher-managed RKE2 upgrades
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    rancher_validate_certs: true
    rancher_cluster_namespace: fleet-default
    rancher_wait: true
    rancher_wait_retries: 120
    rancher_wait_delay: 30
    rancher_api_root: "{{ rancher_url | regex_replace('/+$', '') }}"

  pre_tasks:
    - name: Require Rancher connection settings
      ansible.builtin.assert:
        that:
          - rancher_url is defined
          - rancher_url | length > 0
          - rancher_token is defined
          - rancher_token | length > 0
        fail_msg: "Set rancher_url and rancher_token in AWX credentials or extra vars."

    - name: Require at least one cluster upgrade request
      ansible.builtin.assert:
        that:
          - rke2_cluster_upgrades is defined
          - rke2_cluster_upgrades | length > 0
        fail_msg: "Set rke2_cluster_upgrades with cluster name/namespace/version entries."

    - name: Validate cluster upgrade entries
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.name | length > 0
          - item.version is defined
          - item.version | length > 0
        fail_msg: "Each rke2_cluster_upgrades item needs name and version."
      loop: "{{ rke2_cluster_upgrades }}"
      loop_control:
        label: "{{ item.name | default('missing-name') }}"

  tasks:
    - name: Read current Rancher cluster specs
      ansible.builtin.uri:
        url: >-
          {{ rancher_api_root }}/v1/provisioning.cattle.io.clusters/{{
          item.namespace | default(rancher_cluster_namespace) }}/{{ item.name }}
        method: GET
        headers:
          Authorization: "Bearer {{ rancher_token }}"
          Accept: application/json
        return_content: true
        validate_certs: "{{ rancher_validate_certs | bool }}"
        status_code: 200
      register: rancher_cluster_specs
      loop: "{{ rke2_cluster_upgrades }}"
      loop_control:
        label: "{{ item.namespace | default(rancher_cluster_namespace) }}/{{ item.name }}"
      no_log: true

    - name: Show requested upgrade plan
      ansible.builtin.debug:
        msg:
          cluster: "{{ item.item.namespace | default(rancher_cluster_namespace) }}/{{ item.item.name }}"
          current_version: "{{ item.json.spec.kubernetesVersion | default('unknown') }}"
          desired_version: "{{ item.item.version }}"
      loop: "{{ rancher_cluster_specs.results }}"
      loop_control:
        label: "{{ item.item.namespace | default(rancher_cluster_namespace) }}/{{ item.item.name }}"

    - name: Trigger Rancher upgrade for clusters that need it
      ansible.builtin.uri:
        url: >-
          {{ rancher_api_root }}/v1/provisioning.cattle.io.clusters/{{
          item.item.namespace | default(rancher_cluster_namespace) }}/{{ item.item.name }}
        method: PATCH
        headers:
          Authorization: "Bearer {{ rancher_token }}"
          Accept: application/json
          Content-Type: application/merge-patch+json
        body_format: json
        body:
          spec:
            kubernetesVersion: "{{ item.item.version }}"
        return_content: true
        validate_certs: "{{ rancher_validate_certs | bool }}"
        status_code:
          - 200
          - 202
      register: rancher_upgrade_requests
      loop: "{{ rancher_cluster_specs.results }}"
      loop_control:
        label: "{{ item.item.namespace | default(rancher_cluster_namespace) }}/{{ item.item.name }}"
      changed_when: (item.json.spec.kubernetesVersion | default('')) != item.item.version
      when: (item.json.spec.kubernetesVersion | default('')) != item.item.version
      no_log: true

    - name: Report clusters already at requested version
      ansible.builtin.debug:
        msg: "{{ item.item.name }} is already set to {{ item.item.version }} in Rancher."
      loop: "{{ rancher_cluster_specs.results }}"
      loop_control:
        label: "{{ item.item.namespace | default(rancher_cluster_namespace) }}/{{ item.item.name }}"
      when: item.json.spec.kubernetesVersion | default('') == item.item.version

    - name: Wait for Rancher to report upgraded clusters Ready
      ansible.builtin.uri:
        url: >-
          {{ rancher_api_root }}/v1/provisioning.cattle.io.clusters/{{
          item.namespace | default(rancher_cluster_namespace) }}/{{ item.name }}
        method: GET
        headers:
          Authorization: "Bearer {{ rancher_token }}"
          Accept: application/json
        return_content: true
        validate_certs: "{{ rancher_validate_certs | bool }}"
        status_code: 200
      register: rancher_upgrade_status
      until:
        - (rancher_upgrade_status.json.spec.kubernetesVersion | default('')) == item.version
        - >-
          (rancher_upgrade_status.json.metadata.generation is not defined)
          or
          (rancher_upgrade_status.json.status.observedGeneration is not defined)
          or
          ((rancher_upgrade_status.json.status.observedGeneration | int) >= (rancher_upgrade_status.json.metadata.generation | int))
        - >-
          (rancher_upgrade_status.json.status.ready | default(false) | bool)
          or
          (
            rancher_upgrade_status.json.status.conditions | default([])
            | selectattr('type', 'equalto', 'Ready')
            | selectattr('status', 'equalto', 'True')
            | list
            | length
          ) > 0
      retries: "{{ rancher_wait_retries }}"
      delay: "{{ rancher_wait_delay }}"
      loop: "{{ rke2_cluster_upgrades }}"
      loop_control:
        label: "{{ item.namespace | default(rancher_cluster_namespace) }}/{{ item.name }}"
      when: rancher_wait | bool
      no_log: true

    - name: Show final Rancher upgrade status
      ansible.builtin.debug:
        msg:
          cluster: "{{ item.item.namespace | default(rancher_cluster_namespace) }}/{{ item.item.name }}"
          desired_version: "{{ item.item.version }}"
          rancher_version: "{{ item.json.spec.kubernetesVersion | default('unknown') }}"
          ready: "{{ item.json.status.ready | default(false) }}"
          state: "{{ item.json.metadata.state.name | default(item.json.state | default('unknown')) }}"
      loop: "{{ rancher_upgrade_status.results | default([]) }}"
      loop_control:
        label: "{{ item.item.namespace | default(rancher_cluster_namespace) }}/{{ item.item.name }}"
      when: rancher_wait | bool

---
- name: Read current downstream snapshots
  kubernetes.core.k8s_info:
    host: "{{ rke2_downstream_url }}"
    api_key: "{{ rke2_api_key }}"
    validate_certs: "{{ rke2_verify_ssl }}"
    api_version: k3s.cattle.io/v1
    kind: ETCDSnapshotFile
  register: snapshot_files_before
  changed_when: false

- name: Read the Rancher provisioning cluster
  ansible.builtin.uri:
    url: "{{ rke2_cluster_url }}"
    headers: "{{ rke2_headers }}"
    validate_certs: "{{ rke2_verify_ssl }}"
    return_content: true
    status_code: 200
  register: provisioning_cluster
  changed_when: false
  no_log: true

- name: Prepare the snapshot request
  ansible.builtin.set_fact:
    snapshot_generation: >-
      {{ provisioning_cluster.json.spec.rkeConfig
         .get('etcdSnapshotCreate', {}).get('generation', 0) | int + 1 }}
    snapshot_names_before: >-
      {{ snapshot_files_before.resources | map(attribute='metadata.name') | list }}

- name: Trigger the snapshot through Rancher
  ansible.builtin.uri:
    url: "{{ rke2_cluster_url }}"
    method: PUT
    headers: "{{ rke2_headers }}"
    body_format: json
    body:
      apiVersion: "{{ provisioning_cluster.json.apiVersion }}"
      kind: "{{ provisioning_cluster.json.kind }}"
      metadata:
        name: "{{ clustername }}"
        namespace: fleet-default
        resourceVersion: "{{ provisioning_cluster.json.metadata.resourceVersion }}"
      spec: >-
        {{ provisioning_cluster.json.spec
           | combine({'rkeConfig': {'etcdSnapshotCreate': {
               'generation': snapshot_generation | int
             }}}, recursive=true) }}
    validate_certs: "{{ rke2_verify_ssl }}"
    status_code: 200
  no_log: true

- name: Wait for the new downstream snapshot
  kubernetes.core.k8s_info:
    host: "{{ rke2_downstream_url }}"
    api_key: "{{ rke2_api_key }}"
    validate_certs: "{{ rke2_verify_ssl }}"
    api_version: k3s.cattle.io/v1
    kind: ETCDSnapshotFile
  register: snapshot_files_after
  changed_when: false
  until: >-
    snapshot_files_after.resources
    | map(attribute='metadata.name')
    | difference(snapshot_names_before)
    | length > 0
  retries: "{{ rke2_snapshot_retries }}"
  delay: "{{ rke2_snapshot_delay }}"

- name: Record the verified snapshot
  ansible.builtin.set_fact:
    verified_snapshots: >-
      {{ snapshot_files_after.resources
         | rejectattr('metadata.name', 'in', snapshot_names_before)
         | map(attribute='metadata.name') | list }}

- name: Report the verified snapshot
  ansible.builtin.debug:
    msg:
      generation: "{{ snapshot_generation }}"
      snapshots: "{{ verified_snapshots }}"

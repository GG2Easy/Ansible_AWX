---
- name: Read current downstream snapshot records
  kubernetes.core.k8s_info:
    host: "{{ rke2lifecycle_downstream_api_url }}"
    api_key: "{{ rke2lifecycle_api_key }}"
    validate_certs: "{{ rke2lifecycle_validate_certs }}"
    api_version: k3s.cattle.io/v1
    kind: ETCDSnapshotFile
  register: rke2lifecycle_snapshot_files_before
  changed_when: false

- name: Read the Rancher provisioning cluster
  ansible.builtin.uri:
    url: "{{ rke2lifecycle_provisioning_cluster_url }}"
    method: GET
    headers:
      Authorization: "Bearer {{ rke2lifecycle_api_key }}"
      Accept: application/json
    validate_certs: "{{ rke2lifecycle_validate_certs }}"
    return_content: true
    status_code: 200
  register: rke2lifecycle_provisioning_cluster
  changed_when: false
  no_log: true

- name: Prepare the Rancher snapshot request
  ansible.builtin.set_fact:
    rke2lifecycle_snapshot_generation: >-
      {{ rke2lifecycle_provisioning_cluster.json.spec.rkeConfig
         .get('etcdSnapshotCreate', {}).get('generation', 0) | int + 1 }}
    rke2lifecycle_snapshot_names_before: >-
      {{ rke2lifecycle_snapshot_files_before.resources
         | map(attribute='metadata.name') | list }}

- name: Trigger the snapshot through the Rancher API
  ansible.builtin.uri:
    url: "{{ rke2lifecycle_provisioning_cluster_url }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ rke2lifecycle_api_key }}"
      Accept: application/json
    body_format: json
    body:
      apiVersion: "{{ rke2lifecycle_provisioning_cluster.json.apiVersion }}"
      kind: "{{ rke2lifecycle_provisioning_cluster.json.kind }}"
      metadata:
        name: "{{ rke2lifecycle_cluster_name }}"
        namespace: "{{ rke2lifecycle_provisioning_namespace }}"
        resourceVersion: "{{ rke2lifecycle_provisioning_cluster.json.metadata.resourceVersion }}"
      spec: >-
        {{ rke2lifecycle_provisioning_cluster.json.spec
           | combine({'rkeConfig': {'etcdSnapshotCreate': {
               'generation': rke2lifecycle_snapshot_generation | int
             }}}, recursive=true) }}
    validate_certs: "{{ rke2lifecycle_validate_certs }}"
    status_code: 200
  no_log: true

- name: Wait for the downstream cluster to register the new snapshot
  kubernetes.core.k8s_info:
    host: "{{ rke2lifecycle_downstream_api_url }}"
    api_key: "{{ rke2lifecycle_api_key }}"
    validate_certs: "{{ rke2lifecycle_validate_certs }}"
    api_version: k3s.cattle.io/v1
    kind: ETCDSnapshotFile
  register: rke2lifecycle_snapshot_files_after
  changed_when: false
  until: >-
    rke2lifecycle_snapshot_files_after.resources
    | map(attribute='metadata.name')
    | difference(rke2lifecycle_snapshot_names_before)
    | length > 0
  retries: "{{ (rke2lifecycle_snapshot_timeout_seconds / rke2lifecycle_snapshot_poll_seconds) | int }}"
  delay: "{{ rke2lifecycle_snapshot_poll_seconds | int }}"

- name: Record the verified pre-upgrade snapshot
  ansible.builtin.set_fact:
    rke2lifecycle_verified_snapshot_files: >-
      {{ rke2lifecycle_snapshot_files_after.resources
         | rejectattr('metadata.name', 'in', rke2lifecycle_snapshot_names_before)
         | list }}

- name: Report the verified pre-upgrade snapshot
  ansible.builtin.debug:
    msg:
      generation: "{{ rke2lifecycle_snapshot_generation }}"
      snapshots: "{{ rke2lifecycle_verified_snapshot_files | map(attribute='metadata.name') | list }}"

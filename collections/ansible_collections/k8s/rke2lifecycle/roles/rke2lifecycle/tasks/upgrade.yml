---
- name: Ensure the upgrade job ServiceAccount exists
  kubernetes.core.k8s:
    host: "{{ rke2lifecycle_downstream_api_url }}"
    api_key: "{{ rke2lifecycle_api_key }}"
    validate_certs: "{{ rke2lifecycle_validate_certs }}"
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ rke2lifecycle_upgrade_service_account_name }}"
        namespace: "{{ rke2lifecycle_upgrade_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible
          app.kubernetes.io/part-of: rke2-upgrade

- name: Render the upgrade Plan with native YAML types
  ansible.builtin.set_fact:
    rke2lifecycle_upgrade_plan_definition: >-
      {{ lookup('ansible.builtin.template', 'rke2_upgrade_plan.yml.j2')
         | from_yaml }}

- name: Validate the rendered upgrade Plan
  ansible.builtin.assert:
    that:
      - rke2lifecycle_upgrade_plan_definition is mapping
      - rke2lifecycle_upgrade_plan_definition.spec.concurrency is integer
      - rke2lifecycle_upgrade_plan_definition.spec.cordon is boolean
    fail_msg: >-
      The RKE2 upgrade Plan must contain native integer and boolean fields.
    quiet: true

- name: Submit the RKE2 server upgrade Plan
  kubernetes.core.k8s:
    host: "{{ rke2lifecycle_downstream_api_url }}"
    api_key: "{{ rke2lifecycle_api_key }}"
    validate_certs: "{{ rke2lifecycle_validate_certs }}"
    state: present
    definition: "{{ rke2lifecycle_upgrade_plan_definition }}"
  register: rke2lifecycle_upgrade_plan_submit

- name: Wait for the System Upgrade Controller Plan to complete
  kubernetes.core.k8s_info:
    host: "{{ rke2lifecycle_downstream_api_url }}"
    api_key: "{{ rke2lifecycle_api_key }}"
    validate_certs: "{{ rke2lifecycle_validate_certs }}"
    api_version: upgrade.cattle.io/v1
    kind: Plan
    namespace: "{{ rke2lifecycle_upgrade_namespace }}"
    name: "{{ rke2lifecycle_upgrade_plan_name }}"
  register: rke2lifecycle_upgrade_plan
  changed_when: false
  until:
    - rke2lifecycle_upgrade_plan.get('resources', []) | length == 1
    - >-
      (rke2lifecycle_upgrade_plan.get('resources', [])
       | first | default({})).get('status', {}).get('latestVersion', '')
      == (rke2lifecycle_target_version | replace('+', '-'))
    - >-
      (rke2lifecycle_upgrade_plan.get('resources', [])
       | first | default({})).get('status', {}).get('conditions', [])
      | selectattr('type', 'equalto', 'Complete')
      | selectattr('status', 'equalto', 'True')
      | list | length == 1
  retries: "{{ (rke2lifecycle_upgrade_timeout_seconds / rke2lifecycle_upgrade_poll_seconds) | int }}"
  delay: "{{ rke2lifecycle_upgrade_poll_seconds | int }}"

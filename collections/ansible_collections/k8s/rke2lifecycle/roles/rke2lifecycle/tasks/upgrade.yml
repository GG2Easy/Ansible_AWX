---
- name: Read the latest Rancher provisioning cluster
  ansible.builtin.uri:
    url: "{{ rke2_cluster_url }}"
    headers: "{{ rke2_headers }}"
    validate_certs: "{{ rke2_verify_ssl }}"
    return_content: true
    status_code: 200
  register: provisioning_cluster
  changed_when: false
  no_log: true

- name: Request the RKE2 version through Rancher
  ansible.builtin.uri:
    url: "{{ rke2_cluster_url }}"
    method: PUT
    headers: "{{ rke2_headers }}"
    body_format: json
    body:
      apiVersion: "{{ provisioning_cluster.json.apiVersion }}"
      kind: "{{ provisioning_cluster.json.kind }}"
      metadata:
        name: "{{ clustername }}"
        namespace: fleet-default
        resourceVersion: "{{ provisioning_cluster.json.metadata.resourceVersion }}"
      spec: >-
        {{ provisioning_cluster.json.spec
           | combine({'kubernetesVersion': rke2_target_version}, recursive=true) }}
    validate_certs: "{{ rke2_verify_ssl }}"
    status_code: 200
  changed_when: provisioning_cluster.json.spec.kubernetesVersion != rke2_target_version
  no_log: true

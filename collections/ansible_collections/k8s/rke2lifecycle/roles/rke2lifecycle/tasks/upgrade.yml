---
- name: Read the latest Rancher provisioning cluster
  ansible.builtin.uri:
    url: "{{ rke2lifecycle_provisioning_cluster_url }}"
    method: GET
    headers:
      Authorization: "Bearer {{ rke2lifecycle_api_key }}"
      Accept: application/json
    validate_certs: "{{ rke2lifecycle_validate_certs }}"
    return_content: true
    status_code: 200
  register: rke2lifecycle_provisioning_cluster
  changed_when: false
  no_log: true

- name: Request the RKE2 version through the Rancher API
  ansible.builtin.uri:
    url: "{{ rke2lifecycle_provisioning_cluster_url }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ rke2lifecycle_api_key }}"
      Accept: application/json
    body_format: json
    body:
      apiVersion: "{{ rke2lifecycle_provisioning_cluster.json.apiVersion }}"
      kind: "{{ rke2lifecycle_provisioning_cluster.json.kind }}"
      metadata:
        name: "{{ rke2lifecycle_cluster_name }}"
        namespace: "{{ rke2lifecycle_provisioning_namespace }}"
        resourceVersion: "{{ rke2lifecycle_provisioning_cluster.json.metadata.resourceVersion }}"
      spec: >-
        {{ rke2lifecycle_provisioning_cluster.json.spec
           | combine({'kubernetesVersion': rke2lifecycle_target_version}, recursive=true) }}
    validate_certs: "{{ rke2lifecycle_validate_certs }}"
    status_code: 200
  changed_when: >-
    rke2lifecycle_provisioning_cluster.json.spec.kubernetesVersion
    != rke2lifecycle_target_version
  no_log: true

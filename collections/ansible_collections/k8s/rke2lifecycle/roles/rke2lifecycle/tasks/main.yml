---
- name: Validate the cluster and requested version
  ansible.builtin.import_tasks: validate.yml
  tags: validate

- name: Create a verified pre-upgrade snapshot
  ansible.builtin.import_tasks: snapshot.yml
  when: current_version != rke2_target_version
  tags: snapshot

- name: Request the Rancher-managed upgrade
  ansible.builtin.import_tasks: upgrade.yml
  when: current_version != rke2_target_version
  tags: upgrade

- name: Verify the cluster after the upgrade
  ansible.builtin.import_tasks: verify.yml
  tags: verify

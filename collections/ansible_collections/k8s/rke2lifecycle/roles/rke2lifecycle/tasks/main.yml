---
- name: Validate credentials, cluster health, and requested version
  ansible.builtin.import_tasks: validate.yml
  tags:
    - validate

- name: Create and verify the pre-upgrade etcd snapshot
  ansible.builtin.import_tasks: snapshot.yml
  when: rke2lifecycle_current_version != rke2lifecycle_target_version
  tags:
    - snapshot

- name: Request the RKE2 upgrade through Rancher
  ansible.builtin.import_tasks: upgrade.yml
  tags:
    - upgrade

- name: Verify the completed upgrade
  ansible.builtin.import_tasks: verify.yml
  tags:
    - verify

---
argument_specs:
  main:
    short_description: Snapshot and upgrade a Rancher-managed RKE2 cluster
    description:
      - Validates cluster health and the requested release.
      - Creates an etcd snapshot before requesting the RKE2 version from Rancher.
      - Waits for the node and Rancher to return to a healthy state.
    options:
      rke2lifecycle_api_url:
        type: str
        description: Rancher base URL, without a trailing slash.
      rke2lifecycle_api_key:
        type: str
        no_log: true
        description: Rancher bearer token.
      rke2lifecycle_validate_certs:
        type: bool
        description: Whether to validate Rancher's TLS certificate.
      rke2lifecycle_cluster_id:
        type: str
        description: Rancher downstream cluster identifier.
      rke2lifecycle_cluster_name:
        type: str
        description: Rancher provisioning cluster name.
      rke2lifecycle_provisioning_namespace:
        type: str
        description: Namespace containing the Rancher provisioning cluster.
      rke2lifecycle_downstream_api_url:
        type: str
        description: Rancher Kubernetes proxy URL for the downstream cluster.
      rke2lifecycle_target_version:
        type: str
        description: Exact RKE2 release, for example v1.35.7+rke2r1.
      rke2lifecycle_expected_node_count:
        type: int
        description: Required downstream node count.
      rke2lifecycle_verify_release_tag:
        type: bool
        description: Verify that the target tag exists in the RKE2 GitHub repository.
      rke2lifecycle_snapshot_timeout_seconds:
        type: int
        description: Maximum wait for snapshot completion.
      rke2lifecycle_snapshot_poll_seconds:
        type: int
        description: Snapshot status polling interval.
      rke2lifecycle_upgrade_timeout_seconds:
        type: int
        description: Maximum wait for Plan completion.
      rke2lifecycle_health_timeout_seconds:
        type: int
        description: Maximum wait for post-upgrade cluster health.
      rke2lifecycle_health_poll_seconds:
        type: int
        description: Post-upgrade health polling interval.
